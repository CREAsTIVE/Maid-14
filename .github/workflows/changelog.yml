name: PR Changelogs

on:
  pull_request_target:
    types: [closed]

concurrency: commit_action

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ vars.CHANGELOG_BRANCH }}

      - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL }}"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: cd Tools/changelog && npm install

      - name: Commit changelog
        run: |
          BRANCH="${{ vars.CHANGELOG_BRANCH }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            (cd Tools/changelog && node changelog.js)
            if [[ -z $(git status --porcelain) ]]; then
              echo "No changes to commit"; exit 0
            fi
            git add -- "$CHANGELOG_DIR"
            git commit -m "${{ vars.CHANGELOG_MESSAGE }} (#${{ env.PR_NUMBER }})"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
