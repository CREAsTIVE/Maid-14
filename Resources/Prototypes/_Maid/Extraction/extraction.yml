- type: entity
  parent: BaseAction
  id: ActionRequestExtraction
  name: Request early evacuation
  description: Request an extraction point on the station. The point can be moved only once.
  components:
  - type: Action
    icon:
      sprite: Effects/portal.rsi
      state: portal-blue
    useDelay: 5
  - type: InstantAction
    event: !type:RequestExtractionActionEvent

- type: entity
  parent: BaseAction
  id: ActionCallDropPod
  name: Call drop pod
  description: Call a drop pod to the tile you are standing on. Only works inside your extraction zone. Step aside before it lands!
  components:
  - type: Action
    icon:
      sprite: _Maid/Structures/Storage/drop_pod.rsi
      state: icon
    useDelay: 5
  - type: InstantAction
    event: !type:CallDropPodActionEvent

- type: entity
  parent: BaseAction
  id: ActionLaunchDropPod
  name: START
  description: Seal the drop pod and launch it.
  components:
  - type: Action
    icon:
      sprite: _Maid/Structures/Storage/drop_pod.rsi
      state: icon
    checkCanInteract: false
    useDelay: 2
  - type: InstantAction
    event: !type:LaunchDropPodActionEvent

- type: entity
  id: ExtractionZoneMarker
  name: extraction marker
  description: Extraction marker.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: FloorObjects
    layers:
    - sprite: _Maid/Effects/extraction_zone.rsi
      state: zone
      shader: unshaded
  - type: Clickable
  - type: Visibility
    layer: 256 # VisibilityFlags.MaidExtraction
  - type: ExtractionZone

- type: entity
  id: ExtractionDropPod
  name: drop pod
  description: A small armoured pod. A code keypad blinks next to the hatch.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Maid/Structures/Storage/drop_pod.rsi
    noRot: true
    # the pod is drawn low in its 64x64 frame, lift it onto the middle of its tile
    offset: 0,0.25
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: door
      map: ["enum.StorageVisualLayers.Door"]
    - state: glow_red
      shader: unshaded
      map: ["enum.DropPodVisualLayers.Glow"]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: EntityStorage
    # Goob: allow walking into the open pod
    masksToRemove: 84
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Appearance
  # no open door sprite: the door is hidden while the pod is open
  - type: EntityStorageVisuals
    stateBaseClosed: base
    stateDoorClosed: door
  - type: GenericVisualizer
    visuals:
      enum.DropPodVisuals.Glow:
        enum.DropPodVisualLayers.Glow:
          Locked: { state: glow_red }
          Unlocked: { state: glow_green }
          Sealed: { state: glow_blue }
          Launching: { state: glow_yellow }
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#ff3b3b"
  - type: DropPod
  - type: UserInterface
    interfaces:
      enum.DropPodUiKey.Key:
        type: DropPodBoundUserInterface

- type: decal
  id: DropPodRubble
  defaultCleanable: true
  sprite:
    sprite: _Maid/Decals/drop_pod.rsi
    state: rubble

# testing: drops an empty, unlocked pod on its tile a few seconds after being spawned
- type: entity
  parent: MarkerBase
  id: ExtractionDropPodLandingTest
  name: drop pod landing test
  description: Drops an empty drop pod here a few seconds after spawning. Does not clear the tile.
  suffix: Testing
  components:
  - type: Sprite
    sprite: _Maid/Structures/Storage/drop_pod.rsi
    state: icon
  - type: DropPodLandingTest
