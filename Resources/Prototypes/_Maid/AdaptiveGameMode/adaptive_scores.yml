# Collectors for Antagonists and Roles
- type: entity
  id: AdaptiveNukeopsScoreCollector
  components:
  - type: AdaptiveScoreCollector
    combatScore: 15
    chaosScore: 10
    enumerateComponent: NukeopsRole
    conditionTables:
    - ActiveAntag

- type: entity
  id: AdaptiveTraitorFreeScoreCollector
  components:
  - type: AdaptiveScoreCollector
    combatScore: 10
    chaosScore: 10
    enumerateComponent: TraitorRole
    conditions:
    - !type:AdaptiveScorePlayerUncuffedCondition
    conditionTables:
    - ControlledAlive

- type: entity
  id: AdaptiveTraitorControlledAliveScoreCollector
