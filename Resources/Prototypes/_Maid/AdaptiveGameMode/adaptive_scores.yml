# Static Component Configurations for Global Events and Stationary Entities
- type: entity
  id: AdaptiveAnomalyScoreStatic
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 3
    enumerateComponent: Anomaly

- type: entity
  id: AdaptiveIonStormScoreStatic
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 10
    # checks during active rule

- type: entity
  id: AdaptivePowerGridCheckScoreStatic
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 5

- type: entity
  id: AdaptiveSolarFlareScoreStatic
  components:
  - type: AdaptiveScoreStatic
    chaosScore: 3

- type: entity
  id: AdaptiveScoreGiftEvent
  components:
  - type: TimedDespawn
    lifetime: 300
  - type: AdaptiveScoreStatic
    chaosScore:
      base: -2
      target: 0
      in: 5
