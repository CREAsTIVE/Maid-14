          max: 1
        children:
        - id: Traitor
          weight: 34
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Nukeops
          weight: 10
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Revolutionary
          weight: 7
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Zombie
          weight: 4
