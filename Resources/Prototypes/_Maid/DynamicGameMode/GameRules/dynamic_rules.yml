- type: entity
  parent: BaseGameRule
  id: DynamicRule
  components:
  - type: GameRule
    minPlayers: 0 # We DON'T like greenshifts (players may join midround)
  - type: DynamicRule
    startingBudgetMin: 0
    startingBudgetMax: 100
    budgetPerSecond: 0.02
    table: !type:AllSelector
      children:
      # Roundstart Major Rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 1
        children:
        - id: Traitor
          weight: 34
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Nukeops
          weight: 10
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: Revolutionary
          weight: 7
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: Zombie
          weight: 4
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
        - id: Changeling
          weight: 15
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
        - id: Shadowling
          weight: 10
