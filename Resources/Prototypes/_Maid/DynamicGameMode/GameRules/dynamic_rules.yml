            min: 15
        - id: Wizard
          weight: 5
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 10
      # Roundstart Minor Rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 180
        children:
        - id: Devil
          prob: 0.5
          conditions:
          - !type:RuleHasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
      # Midround rules
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          min: 300
        children:
        - id: SleeperAgents
          weight: 15
          conditions:
